<!--
  Supabase Dashboard -> Authentication -> Emails -> "Reauthentication" template.
  This one is a CODE, not a link — reauthentication happens inside an
  already-open session in the app, so the user types this code back in
  rather than clicking through. Keep {{ .Token }} exactly as-is.
  Subject: Your Lumina Vote confirmation code
-->
<div style="background:#faf7f0;padding:40px 20px;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #eee4d3;border-radius:18px;overflow:hidden;">
    <tr>
      <td style="padding:32px 32px 0;text-align:center;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 18px;">
          <tr>
            <td bgcolor="#d4af37" style="width:40px;height:40px;border-radius:10px;background-color:#d4af37;text-align:center;vertical-align:middle;font-weight:900;font-style:italic;color:#ffffff;font-size:20px;">V</td>
          </tr>
        </table>
        <h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:900;color:#161311;">Confirm it's you</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 0;text-align:center;">
        <p style="margin:0;color:#6b6156;font-size:15px;line-height:1.6;">
          Enter this code in <b style="color:#161311;">Lumina Vote</b> to confirm this sensitive action:
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px;text-align:center;">
        <div style="display:inline-block;background:#f6f0e2;border-radius:14px;padding:16px 28px;font-family:Georgia,'Times New Roman',serif;font-size:32px;font-weight:900;letter-spacing:6px;color:#161311;">{{ .Token }}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 32px;text-align:center;">
        <p style="margin:0;color:#a99a80;font-size:12.5px;line-height:1.6;">
          If you didn't try to do this, you can safely ignore this email.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px;border-top:1px solid #eee4d3;text-align:center;">
        <p style="margin:0;color:#a99a80;font-size:12px;line-height:1.6;">
          Lumina Creative Co &middot; A Campus Plug Technologies product
        </p>
      </td>
    </tr>
  </table>
</div>
